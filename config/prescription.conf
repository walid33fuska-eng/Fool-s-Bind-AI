# ============================================
# Fool's Bind AI - روشتة الطبيب (Prescription)
# ============================================
# هذا الملف يحدد الأدوات المسموح للطبيب (الرازي) بالتعامل معها
# الأداة تعمل فقط على الأدوات المذكورة هنا
# ============================================

# ============================================
# ✅ الأدوات المسموحة (Whitelist)
# ============================================
# كل أداة في السطر الأول فقط
# الصيغة: tool_name | الحد الأقصى للمحاولات | مهلة الانتظار
# ============================================

[allowed_tools]
nmap | 3 | 30
wireshark | 2 | 45
python | 3 | 20
python3 | 3 | 20
node | 2 | 30
nodejs | 2 | 30
git | 2 | 60
curl | 2 | 20
wget | 2 | 20
perl | 1 | 10
bash | 1 | 10
ruby | 3 | 40
go | 3 | 50
rustc | 3 | 60
gcc | 3 | 60
clang | 3 | 60
make | 2 | 30
cmake | 2 | 40
openssl | 2 | 30
ssh | 2 | 30
ping | 1 | 10
traceroute | 2 | 30
netstat | 1 | 10
ifconfig | 1 | 10
iptables | 2 | 20
tcpdump | 2 | 30
metasploit | 5 | 120
sqlmap | 3 | 90

# ============================================
# 📋 أدوات مخصصة (يضيفها المستخدم بنفسه)
# ============================================
# الصيغة: tool_name | max_attempts | timeout_seconds
# مثال: my_tool | 3 | 60

[custom_tools]
# أضف أدواتك هنا كل一行
# مثال: my_custom_tool | 3 | 45

# ============================================
# 🚫 الأدوات الممنوعة (Blacklist Override)
# ============================================
# هذه القائمة تتجاوز قاعدة البيانات الرئيسية
# لا يمكن للطبيب التعامل مع هذه الأدوات تحت أي ظرف
# ============================================

[forbidden_tools]
# zphisher
# blackeye
# shellphish
# hiddeneye
# hydra
# slowloris
# hulk
# goldeneye

# ============================================
# ⚙️ الإعدادات العامة للروشتة
# ============================================

[settings]
# هل تفرض الروشتة نفسها على كل الأدوات؟
# إذا كانت yes، الطبيب لا يعمل إلا على الأدوات المذكورة فقط
# إذا كانت no، الطبيب يعمل على أي أداة يكتشفها تلقائياً
enforce_prescription = yes

# هل تسمح بإضافة أدوات جديدة تلقائياً إلى القائمة المسموحة؟
auto_add_new_tools = no

# هل تطلب من المستخدم إضافة الأداة يدوياً إذا كانت غير موجودة؟
ask_to_add_missing_tool = yes

# الحد الأقصى لعدد الأدوات التي يمكن معالجتها في جلسة واحدة
max_tools_per_session = 20

# هل تفرض ترتيب معين لمعالجة الأدوات؟
# الخيارات: as_listed (كما هو مذكور), alphabetical (أبجدي), auto (تلقائي حسب الأهمية)
processing_order = auto

# ============================================
# 📊 إحصائيات الأدوات (اختياري)
# ============================================

[statistics]
# هل تسجل إحصائيات عن نجاح وفشل كل أداة؟
enable_stats = yes

# هل تشارك الإحصائيات مع خادم التحديثات (بدون معلومات شخصية)？
share_anonymized_stats = no

# ============================================
# 🧪 مثال على كيفية إضافة أداة جديدة
# ============================================
# 1. أضف الاسم تحت [custom_tools]
# 2. حدد max_attempts و timeout_seconds
# 3. احفظ الملف وأعد تشغيل الأداة
# ============================================
