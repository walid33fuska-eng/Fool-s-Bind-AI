# ============================================
# Fool's Bind AI - إعدادات المستشفى
# ============================================
# هذا الملف يتحكم في سلوك الأداة بالكامل
# لا تعدل إلا إذا كنت تعرف ماذا تفعل
# ============================================

# ============================================
# 🩺 إعدادات عامة (General Settings)
# ============================================

# مستوى التفصيل في التقرير النهائي
# القيم: silent, normal, verbose, debug
verbose_level = normal

# اللغة الأساسية للأداة (ar = عربي, en = إنجليزي)
language = ar

# تفعيل الألوان في المخرجات (yes / no)
enable_colors = yes

# ============================================
# 🔬 إعدادات الذكاء الاصطناعي (AI Settings)
# ============================================

# تفعيل الذكاء الاصطناعي (العقل الفارابي)
# إذا كان no، تعمل الأداة بدون AI
enable_qnai = yes

# نماذج Groq API المدعومة
# الخيارات: llama3-70b, mixtral-8x7b, gemma2-9b
groq_model = llama3-70b

# درجة الحرارة (الإبداع) في استجابات AI
# القيم: 0.0 (دقيق جداً) إلى 1.0 (إبداعي)
ai_temperature = 0.3

# الحد الأقصى لعدد الرموز (tokens) في استجابة AI
ai_max_tokens = 2048

# ============================================
# ⚛️ إعدادات النموذج الكمي (QFEM Settings)
# ============================================

# تفعيل التشابك الوظيفي الكمي
enable_qfem = yes

# فترة المراقبة الفورية بالثواني (كل كم ثانية يتم الفحص)
# القيم: 0.5 إلى 5.0
observation_interval = 0.5

# هل تدمر الأداة نفسها عند اكتشاف اختراق؟
self_destruct_on_breach = yes

# هل تسمح بالنسخ إلى جهاز آخر؟
allow_copy = no

# ============================================
# 👮 إعدادات رجال الأمن (Security Guards Settings)
# ============================================

# تفعيل رجال الأمن (عنترة وفريقه)
enable_guards = yes

# دورية التطواف: الوقت العشوائي الأقصى بين الفحوصات (بالثواني)
# القيم: 10 إلى 300
max_patrol_interval = 60

# تفعيل حارس الظل (نسخة مخفية في RAM)
enable_shadow_guard = yes

# تفعيل ضابط الاتصالات (مراقبة الإنترنت)
enable_comm_officer = yes

# ============================================
# 👨‍⚕️ إعدادات الممرضين (Nurses Settings)
# ============================================

# تفعيل الممرضين (رفيدة وفريقها)
enable_nurses = yes

# الحد الأقصى لمحاولات التثبيت قبل الإبلاغ عن الفشل
max_retry_count = 3

# مهلة الانتظار بين المحاولات (بالثواني)
retry_delay = 5

# هل يقوم الممرض بتنظيف الملفات المؤقتة بعد الانتهاء؟
cleanup_temp_files = yes

# ============================================
# 🏛️ إعدادات المدير (Director Settings)
# ============================================

# تفعيل المدير (ابن سينا)
enable_director = yes

# هل يطلب المدير من المستخدم إثبات هويته قبل العمل؟
require_user_verification = yes

# مستوى الصرامة عند اكتشاف الاحتيال
# القيم: 1 (خفيف), 2 (متوسط), 3 (صارم), 4 (شديد), 5 (أقصى)
severity_level = 5

# هل يسجل المدير كل قراراته في سجل منفصل؟
log_director_decisions = yes

# ============================================
# 🎨 إعدادات الجماليات (Beauty Settings)
# ============================================

# تفعيل الجماليات والكماليات
enable_beauty = yes

# الجلد العاطفي المختار
# الخيارات: surgeon, hacker, zen, creative
emotional_skin = hacker

# تفعيل الشاشة التمهيدية الكمومية (لا تتكرر أبداً)
enable_quantum_splash = yes

# تفعيل التنفس الاصطناعي (يظهر عند السكون)
enable_artificial_breathing = yes

# تفعيل التوقيع الصوتي النصي (رموز موسيقية بجانب الأوامر)
enable_tas = yes

# تفعيل البصمة الحيوية للطرفية (التعرف على المستخدم من كتابته)
enable_terminal_biometrics = yes

# ============================================
# 🌐 إعدادات الإنترنت (Internet Settings)
# ============================================

# خادم فحص الإنترنت (يفضل ألا يكون google لتجنب الحظر)
internet_check_host = 1.1.1.1

# مهلة فحص الإنترنت بالثواني
internet_timeout = 5

# هل تتوقف الأداة تماماً إذا لم يوجد إنترنت؟
stop_on_no_internet = yes

# ============================================
# 📱 إعدادات المنصات (Platform Settings)
# ============================================

# المسار الافتراضي لـ Termux (يكتشف تلقائياً، لا تغيره)
termux_path = auto

# تفعيل دعم iOS (إذا كنت على iOS، اجعله yes)
ios_support = auto

# ============================================
# 📝 إعدادات التسجيل (Logging Settings)
# ============================================

# تفعيل التسجيل في الملفات
enable_logging = yes

# أقصى حجم لملف السجل (بالميجابايت)
max_log_size_mb = 10

# عدد ملفات السجل القديمة التي يتم الاحتفاظ بها
log_rotation_count = 5

# ============================================
# 🛡️ إعدادات الأمان الإضافية (Security Settings)
# ============================================

# هل تتحقق الأداة من سلامة ملفاتها قبل التشغيل؟
integrity_check_before_start = yes

# هل تسمح بتشغيل الأداة في وضع التصحيح (debugging)؟
allow_debugging = no

# القائمة السوداء الإضافية (مسارات لأدوات ممنوعة)
additional_blacklist = /sdcard/hacking_tools/, /data/local/tmp/malware/

# ============================================
# ⚙️ إعدادات متقدمة (Advanced Settings)
# ============================================

# الحد الأقصى لعدد الحلول التي تجربها الأداة قبل الإبلاغ عن الفشل
max_solutions_to_try = 10

# هل تطلب الأداة تأكيداً قبل العمليات الخطيرة (مثل حذف ملفات)؟
require_confirmation_for_destructive = yes

# مهلة الانتظار القصوى لاستجابة الممرض (بالثواني)
nurse_timeout = 30

# ============================================
# 🧪 إعدادات الاختبار (اختياري، للمطورين فقط)
# ============================================

# وضع الاختبار (لا يؤثر على النظام الحقيقي)
test_mode = no

# اختبار وهمي (محاكاة بدون تنفيذ فعلي)
dry_run = no
